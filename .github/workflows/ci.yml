name: Zap-SDK

on:
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: 24.15.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
        shell: bash
      - run: pnpm test
        shell: bash
